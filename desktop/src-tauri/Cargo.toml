[package]
name = "reading_task_desktop"
version = "0.1.0"
description = "Desktop shell for reading_task"
authors = ["reading_task"]
edition = "2021"

[lib]
name = "reading_task_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
log.workspace = true
reading_task = { path = "../.." }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tokio.workspace = true
