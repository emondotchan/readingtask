[package]
name = "reading-task"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
env_logger = "0.11"
futures-util = "0.3"
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dependencies]
anyhow = "1.0"
calamine = "0.31"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
axum.workspace = true
env_logger.workspace = true
futures-util.workspace = true
include_dir = "0.7"
log.workspace = true
mime_guess = "2.0"
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
rand = "0.10"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0"
tokio.workspace = true
tokio-stream.workspace = true
toml = "1.1.2"
tower-http.workspace = true

[dev-dependencies]
tempfile = "3.15"

[profile.dev]
incremental = true
debug = 1

[profile.dev.build-override]
debug = false
incremental = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
